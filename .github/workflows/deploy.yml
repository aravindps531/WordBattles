name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Skip if Cloudflare is not configured
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "No CLOUDFLARE_API_TOKEN secret; skipping deploy."; fi
      - if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 migrations apply word-battles --remote
      - if: steps.check.outputs.skip != 'true'
        run: npm run deploy
